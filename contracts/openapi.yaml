openapi: 3.1.0
info:
  title: MESH API
  version: 0.3.0
  license: { name: UNLICENSED, identifier: LicenseRef-UNLICENSED }
  description: |
    Contract for the MESH student-collaboration modular monolith. This milestone exposes account,
    profile, self-declared skills, goals, interests, desired skills, weekly availability, GitHub public-repository evidence,
    discovery, connections, project groups, persistent messages, tasks, calendar events, and availability polls.
    GitHub evidence is a limited supporting signal, never proof of expertise. LinkedIn is not collected or scraped.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /actuator/health:
    get:
      operationId: healthCheck
      summary: Check API and database health for deployment monitoring
      security: []
      responses:
        '200': { description: Service is healthy, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }
        '503': { description: Service is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }
  /auth/register:
    post:
      operationId: register
      summary: Create a student account and an empty working profile
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      operationId: login
      summary: Exchange email and password for a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/me:
    get:
      operationId: getMyProfile
      summary: Get the signed-in student's profile and self-declared skills
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateMyProfile
      summary: Replace editable profile fields for the signed-in student
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfileRequest' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/me/skills:
    put:
      operationId: replaceMySkills
      summary: Replace all self-declared skills; this does not create evidence or verify expertise
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceSkillsRequest' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/me/goals:
    put:
      operationId: replaceMyGoals
      summary: Replace the signed-in student's collaboration goals
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceGoalsRequest' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/me/interests:
    put:
      operationId: replaceMyInterests
      summary: Replace the signed-in student's interests from the curated catalogue
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceInterestsRequest' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/me/desired-skills:
    put:
      operationId: replaceMyDesiredSkills
      summary: Replace skills the signed-in student is looking for in a collaborator
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceDesiredSkillsRequest' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/me/availability:
    put:
      operationId: replaceMyAvailability
      summary: Replace weekly availability windows for matching and future availability polls
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceAvailabilityRequest' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /skills:
    get:
      operationId: listSkills
      summary: List the curated skill catalogue
      responses:
        '200': { description: Skill catalogue, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Skill' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /goals:
    get:
      operationId: listGoals
      summary: List collaboration goals available for profiles
      responses:
        '200': { description: Goal catalogue, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Goal' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /interests:
    get:
      operationId: listInterests
      summary: List interests available for profiles
      responses:
        '200': { description: Interest catalogue, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Interest' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /domains:
    get:
      operationId: listDomains
      summary: List primary domains used to balance Discover recommendations
      responses:
        '200': { description: Domain catalogue, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Domain' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /recommendations:
    get:
      operationId: listRecommendations
      summary: List explainable collaborator recommendations for the signed-in student
      description: Excludes the signed-in student, either-direction blocks, students passed by the viewer, and existing connections. The feed targets 80% same-domain and 20% adjacent-domain candidates, then fills from available eligible pools.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        '200': { description: Ranked recommendations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Recommendation' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /discover/{targetUserId}/pass:
    put:
      operationId: passCandidate
      summary: Mark a student as passed so they are excluded from future Discover results
      parameters: [ { $ref: '#/components/parameters/TargetUserId' } ]
      responses:
        '204': { description: Pass recorded }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /discover/{targetUserId}/save:
    put:
      operationId: saveCandidate
      summary: Save a student for later without excluding them from Discover
      parameters: [ { $ref: '#/components/parameters/TargetUserId' } ]
      responses:
        '204': { description: Saved state recorded }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeSavedCandidate
      summary: Remove a student from the signed-in student's saved candidates
      parameters: [ { $ref: '#/components/parameters/TargetUserId' } ]
      responses:
        '204': { description: Saved state removed; no action is needed if the student was not saved }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blocks/{targetUserId}:
    put:
      operationId: blockStudent
      summary: Block a student; hide the connection and prevent direct messages while the block is active
      parameters: [ { $ref: '#/components/parameters/TargetUserId' } ]
      responses:
        '204': { description: Student blocked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unblockStudent
      summary: Remove a block created by the signed-in student
      parameters: [ { $ref: '#/components/parameters/TargetUserId' } ]
      responses:
        '204': { description: Block removed; succeeds when no block exists }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connection-requests:
    post:
      operationId: createConnectionRequest
      summary: Send or reopen a connection request
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SendConnectionRequest' } } }
      responses:
        '201': { description: Pending request, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionRequest' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /connection-requests/incoming:
    get:
      operationId: listIncomingConnectionRequests
      summary: List pending requests sent to the signed-in student
      responses:
        '200': { description: Pending incoming requests, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConnectionRequest' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connection-requests/{requestId}/accept:
    patch:
      operationId: acceptConnectionRequest
      summary: Accept an incoming pending request and create a connection
      parameters: [ { $ref: '#/components/parameters/RequestId' } ]
      responses:
        '200': { description: Connection created, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connection-requests/{requestId}/decline:
    patch:
      operationId: declineConnectionRequest
      summary: Decline an incoming pending request
      parameters: [ { $ref: '#/components/parameters/RequestId' } ]
      responses:
        '204': { description: Request declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connection-requests/{requestId}:
    delete:
      operationId: cancelConnectionRequest
      summary: Cancel a pending request sent by the signed-in student
      parameters: [ { $ref: '#/components/parameters/RequestId' } ]
      responses:
        '204': { description: Request cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connections:
    get:
      operationId: listConnections
      summary: List established connections for the signed-in student, excluding active blocks
      responses:
        '200': { description: Connections, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Connection' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connections/{connectionId}/messages:
    get:
      operationId: listConnectionMessages
      summary: List recent private messages in chronological order; connected students only
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Connection messages, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConnectionMessage' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: sendConnectionMessage
      summary: Send a private message; connected students only
      parameters: [ { $ref: '#/components/parameters/ConnectionId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SendConnectionMessageRequest' } } }
      responses:
        '201': { description: Message sent, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionMessage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /github/authorization-url:
    post:
      operationId: beginGitHubAuthorization
      summary: Create a single-use GitHub OAuth authorization URL for public repository evidence
      description: Requests no GitHub scopes and uses PKCE. The frontend redirects the student to `authorizationUrl`; access tokens are never returned or persisted by MESH.
      responses:
        '200': { description: Authorization URL created, content: { application/json: { schema: { $ref: '#/components/schemas/GitHubAuthorizationUrl' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /github/callback:
    get:
      operationId: completeGitHubAuthorization
      summary: GitHub OAuth redirect callback
      description: Public browser callback only. On success or failure, redirects to the configured frontend URL. It is not called by the frontend API client.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302': { description: Redirected to configured success or error frontend URL }
  /github/connection:
    get:
      operationId: getGitHubConnection
      summary: Get GitHub public-evidence connection state for the signed-in student
      responses:
        '200': { description: Connection status, content: { application/json: { schema: { $ref: '#/components/schemas/GitHubConnection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: disconnectGitHub
      summary: Delete collected GitHub repository evidence and disconnect GitHub
      responses:
        '204': { description: GitHub connection and stored public evidence deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /discord/authorization-url:
    post:
      operationId: beginDiscordAuthorization
      summary: Create a single-use Discord OAuth authorization URL to link a MESH account to a Discord identity
      description: Requests only Discord identity. Discord access tokens are exchanged server-side and never persisted.
      responses:
        '200': { description: Authorization URL created, content: { application/json: { schema: { $ref: '#/components/schemas/DiscordAuthorizationUrl' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /discord/callback:
    get:
      operationId: completeDiscordAuthorization
      summary: Discord OAuth redirect callback
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302': { description: Redirected to configured success or error frontend URL }
  /discord/connection:
    get:
      operationId: getDiscordConnection
      summary: Get the signed-in student's linked Discord identity
      responses:
        '200': { description: Discord connection state, content: { application/json: { schema: { $ref: '#/components/schemas/DiscordConnection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: disconnectDiscord
      summary: Remove the signed-in student's linked Discord identity
      responses:
        '204': { description: Discord identity removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects/{projectId}/discord-room:
    get:
      operationId: getProjectDiscordRoom
      summary: Get the Discord room for a project; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Current room state, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectDiscordRoom' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createOrSyncProjectDiscordRoom
      summary: Create or synchronize a private Discord room; project owner only
      description: Every project member must link Discord before this endpoint grants room access.
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Created or synchronized room, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectDiscordRoom' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /projects:
    post:
      operationId: createProject
      summary: Create a project group with the signed-in student as owner
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectInput' } } }
      responses:
        '201': { description: Project created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listMyProjects
      summary: List projects the signed-in student belongs to
      responses:
        '200': { description: Projects, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Project' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Get one project and its members
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateProject
      summary: Update a project; owner only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectInput' } } }
      responses:
        '200': { description: Updated project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProject
      summary: Delete a project; owner only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '204': { description: Project deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/members:
    post:
      operationId: addProjectMember
      summary: Add one of the owner's established connections to a project
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddProjectMemberRequest' } } }
      responses:
        '200': { description: Project with the added member, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/members/{userId}:
    delete:
      operationId: removeProjectMember
      summary: Remove a non-owner project member; owner only
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/UserId' } ]
      responses:
        '204': { description: Member removed }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/ownership:
    patch:
      operationId: transferProjectOwnership
      summary: Transfer project ownership to an existing member; owner only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransferProjectOwnershipRequest' } } }
      responses:
        '200': { description: Project with updated ownership, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/messages:
    get:
      operationId: listProjectMessages
      summary: List recent persistent messages in chronological order; project members only
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Messages, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectMessage' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: sendProjectMessage
      summary: Send a persistent project message; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SendProjectMessageRequest' } } }
      responses:
        '201': { description: Message sent, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectMessage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/tasks:
    get:
      operationId: listProjectTasks
      summary: List project tasks; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Tasks, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectTask' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProjectTask
      summary: Create a task; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateProjectTaskRequest' } } }
      responses:
        '201': { description: Task created, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectTask' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/tasks/{taskId}:
    put:
      operationId: updateProjectTask
      summary: Update a task; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/TaskId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProjectTaskRequest' } } }
      responses:
        '200': { description: Task updated, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectTask' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProjectTask
      summary: Delete a task; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '204': { description: Task deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/events:
    get:
      operationId: listProjectEvents
      summary: List project calendar events; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Calendar events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProjectEvent
      summary: Create a project calendar event; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCalendarEventRequest' } } }
      responses:
        '201': { description: Event created, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarEvent' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/events/{eventId}:
    put:
      operationId: updateProjectEvent
      summary: Update a project calendar event; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EventId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCalendarEventRequest' } } }
      responses:
        '200': { description: Event updated, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarEvent' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProjectEvent
      summary: Delete a project calendar event; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EventId' } ]
      responses:
        '204': { description: Event deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/availability-polls:
    get:
      operationId: listAvailabilityPolls
      summary: List availability polls and vote totals; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Availability polls, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AvailabilityPoll' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAvailabilityPoll
      summary: Create an availability poll with two to eight time options; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAvailabilityPollRequest' } } }
      responses:
        '201': { description: Poll created, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityPoll' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/availability-polls/{pollId}/options/{optionId}/vote:
    put:
      operationId: voteAvailabilityPollOption
      summary: Vote for an open availability option; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PollId' }, { $ref: '#/components/parameters/OptionId' } ]
      responses:
        '204': { description: Vote recorded; repeated calls are idempotent }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeAvailabilityPollVote
      summary: Remove a vote from an open availability option; project members only
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PollId' }, { $ref: '#/components/parameters/OptionId' } ]
      responses:
        '204': { description: Vote removed; succeeds when no vote exists }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/availability-polls/{pollId}/close:
    patch:
      operationId: closeAvailabilityPoll
      summary: Select an option and close an availability poll; project owner only
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PollId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloseAvailabilityPollRequest' } } }
      responses:
        '200': { description: Closed poll, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityPoll' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/availability-polls/{pollId}/schedule:
    post:
      operationId: scheduleAvailabilityPoll
      summary: Create a calendar event from a closed availability poll; project owner only
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PollId' } ]
      responses:
        '200': { description: Scheduled event, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarEvent' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    ValidationError:
      description: Request field validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: A unique value is already in use
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: The signed-in student is not allowed to perform this action
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: The requested resource does not exist or is not accessible
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: The requested integration is not configured
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  parameters:
    TargetUserId:
      name: targetUserId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PollId:
      name: pollId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionId:
      name: optionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }
    RegisterRequest:
      type: object
      required: [displayName, username, email, password]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100, example: Asha Patel }
        username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,39}$', example: asha.builds }
        email: { type: string, format: email, maxLength: 254, example: asha@university.edu }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: asha@university.edu }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      required: [token, tokenType, expiresAt, user]
      properties:
        token: { type: string, description: "Send as Authorization: Bearer <token>." }
        tokenType: { type: string, const: Bearer }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/Profile' }
    GitHubAuthorizationUrl:
      type: object
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: { type: string, format: uri, description: Open in the browser to let the student authorize collection of public repository evidence. }
        expiresAt: { type: string, format: date-time, description: Authorization URL expiration; currently 10 minutes after creation. }
    GitHubConnection:
      type: object
      required: [connected, publicRepositoryCount]
      properties:
        connected: { type: boolean }
        login: { type: [string, 'null'], description: Public GitHub login when connected. }
        avatarUrl: { type: [string, 'null'], format: uri }
        publicRepositoryCount: { type: integer, minimum: 0, description: "Number of most-recent owned public repositories stored as evidence, capped by server configuration." }
        authorizedAt: { type: [string, 'null'], format: date-time }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
    DiscordAuthorizationUrl:
      type: object
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    DiscordConnection:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        discordUserId: { type: [string, 'null'] }
        username: { type: [string, 'null'] }
        globalName: { type: [string, 'null'] }
        connectedAt: { type: [string, 'null'], format: date-time }
    ProjectDiscordRoom:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        channelId: { type: [string, 'null'] }
        inviteUrl: { type: [string, 'null'], format: uri }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        department: { type: [string, 'null'], maxLength: 120 }
        yearOfStudy: { type: [integer, 'null'], minimum: 1, maximum: 8 }
        bio: { type: [string, 'null'], maxLength: 500 }
        avatarKey: { type: [string, 'null'], maxLength: 60 }
        availability: { type: [string, 'null'], maxLength: 120, description: Optional short human-readable availability summary. }
        primaryDomain: { type: [string, 'null'], maxLength: 80 }
        onboardingComplete: { type: boolean, default: false }
    ReplaceSkillsRequest:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          maxItems: 50
          items:
            type: object
            required: [skillId, proficiency]
            properties:
              skillId: { type: integer, format: int64 }
              proficiency: { type: integer, minimum: 1, maximum: 5, description: "Student self-assessment, not a verified score." }
    ReplaceGoalsRequest:
      type: object
      required: [goalCodes]
      properties:
        goalCodes: { type: array, maxItems: 7, items: { type: string, example: HACKATHON } }
    ReplaceInterestsRequest:
      type: object
      required: [interestIds]
      properties:
        interestIds: { type: array, maxItems: 12, items: { type: integer, format: int64 } }
    ReplaceDesiredSkillsRequest:
      type: object
      required: [skillIds]
      properties:
        skillIds: { type: array, maxItems: 12, items: { type: integer, format: int64 } }
    ReplaceAvailabilityRequest:
      type: object
      required: [timezone, windows]
      properties:
        timezone: { type: string, description: IANA timezone, example: Asia/Kolkata }
        windows: { type: array, maxItems: 28, items: { $ref: '#/components/schemas/AvailabilityWindow' } }
    Profile:
      type: object
      required: [id, username, displayName, onboardingComplete, skills, goals, interests, desiredSkills, availabilityWindows]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        department: { type: [string, 'null'] }
        yearOfStudy: { type: [integer, 'null'] }
        bio: { type: [string, 'null'] }
        avatarKey: { type: [string, 'null'] }
        availability: { type: [string, 'null'] }
        availabilityTimezone: { type: [string, 'null'], description: IANA timezone for `availabilityWindows`. }
        primaryDomain: { type: [string, 'null'] }
        onboardingComplete: { type: boolean }
        skills: { type: array, items: { $ref: '#/components/schemas/ProfileSkill' } }
        goals: { type: array, items: { $ref: '#/components/schemas/Goal' } }
        interests: { type: array, items: { $ref: '#/components/schemas/Interest' } }
        desiredSkills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        availabilityWindows: { type: array, items: { $ref: '#/components/schemas/AvailabilityWindow' } }
    Skill:
      type: object
      required: [id, name, category]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category: { type: string }
    ProfileSkill:
      allOf:
        - $ref: '#/components/schemas/Skill'
        - type: object
          required: [proficiency, evidenceSupported]
          properties:
            proficiency: { type: integer, minimum: 1, maximum: 5, description: Self-declared proficiency. }
            evidenceSupported: { type: boolean, description: "True only when an authorized GitHub public-repository language matches the self-declared skill; it is a supporting signal, not proof of expertise." }
    Goal:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: HACKATHON }
        name: { type: string, example: Hackathon project }
    Interest:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Domain:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: WEB_DEVELOPMENT }
        name: { type: string, example: Web Development }
    AvailabilityWindow:
      type: object
      required: [dayOfWeek, startMinute, endMinute]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: ISO weekday number; 1 is Monday. }
        startMinute: { type: integer, minimum: 0, maximum: 1439, description: Minutes after midnight in `timezone`. }
        endMinute: { type: integer, minimum: 1, maximum: 1440, description: Must be later than `startMinute`. }
    Recommendation:
      type: object
      required: [userId, username, displayName, score, reason, breakdown, skills, complementarySkills, saved, feedSource]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        department: { type: [string, 'null'] }
        yearOfStudy: { type: [integer, 'null'] }
        bio: { type: [string, 'null'] }
        avatarKey: { type: [string, 'null'] }
        availability: { type: [string, 'null'] }
        score: { type: number, minimum: 0, maximum: 100 }
        reason: { type: string, description: Plain-language summary of the strongest non-zero matching signals. }
        breakdown: { $ref: '#/components/schemas/RecommendationBreakdown' }
        skills: { type: array, items: { $ref: '#/components/schemas/RecommendedSkill' } }
        complementarySkills: { type: array, items: { type: string } }
        saved: { type: boolean }
        feedSource: { type: string, enum: [PRIMARY_DOMAIN, ADJACENT_DOMAIN, GENERAL] }
    RecommendationBreakdown:
      type: object
      required: [projectGoals, complementarySkills, skillEvidence, availabilityOverlap, sharedInterests]
      properties:
        projectGoals: { type: number, minimum: 0, maximum: 100, description: Unweighted goal-compatibility signal. }
        complementarySkills: { type: number, minimum: 0, maximum: 100, description: Unweighted desired-skill coverage signal. }
        skillEvidence: { type: number, minimum: 0, maximum: 100, description: "Percentage of a candidate's self-declared skills that match languages in their authorized GitHub public-repository evidence. It is a supporting signal, not proof of expertise." }
        availabilityOverlap: { type: number, minimum: 0, maximum: 100 }
        sharedInterests: { type: number, minimum: 0, maximum: 100 }
    RecommendedSkill:
      type: object
      required: [id, name, proficiency]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        proficiency: { type: integer, minimum: 1, maximum: 5, description: Self-declared proficiency. }
    SendConnectionRequest:
      type: object
      required: [recipientUserId]
      properties:
        recipientUserId: { type: string, format: uuid }
    ConnectionRequest:
      type: object
      required: [id, senderId, senderUsername, senderName, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        senderUsername: { type: string }
        senderName: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, CANCELLED] }
        createdAt: { type: string, format: date-time }
    Connection:
      type: object
      required: [id, collaborator, createdAt]
      properties:
        id: { type: string, format: uuid }
        collaborator: { $ref: '#/components/schemas/Collaborator' }
        createdAt: { type: string, format: date-time }
    SendConnectionMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    ConnectionMessage:
      type: object
      required: [id, connectionId, senderId, senderName, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        senderName: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    Collaborator:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        department: { type: [string, 'null'] }
        yearOfStudy: { type: [integer, 'null'] }
        bio: { type: [string, 'null'] }
        avatarKey: { type: [string, 'null'] }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: Campus accessibility map }
        summary: { type: [string, 'null'], maxLength: 1000, example: Map accessible routes around campus. }
        domain: { type: [string, 'null'], maxLength: 80, example: WEB_DEVELOPMENT }
    AddProjectMemberRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    TransferProjectOwnershipRequest:
      type: object
      required: [newOwnerUserId]
      properties:
        newOwnerUserId: { type: string, format: uuid }
    Project:
      type: object
      required: [id, name, ownerUserId, createdAt, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        summary: { type: [string, 'null'] }
        domain: { type: [string, 'null'] }
        ownerUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        members: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } }
    ProjectMember:
      type: object
      required: [userId, username, displayName, role]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarKey: { type: [string, 'null'] }
        role: { type: string, enum: [OWNER, MEMBER] }
    SendProjectMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    ProjectMessage:
      type: object
      required: [id, projectId, senderId, senderName, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        senderName: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    CreateProjectTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 2000 }
        assigneeUserId: { type: [string, 'null'], format: uuid }
        dueDate: { type: [string, 'null'], format: date }
    UpdateProjectTaskRequest:
      type: object
      required: [title, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 2000 }
        status: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
        assigneeUserId: { type: [string, 'null'], format: uuid }
        dueDate: { type: [string, 'null'], format: date }
    ProjectTask:
      type: object
      required: [id, projectId, title, status, createdByUserId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
        assigneeUserId: { type: [string, 'null'], format: uuid }
        dueDate: { type: [string, 'null'], format: date }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateCalendarEventRequest:
      type: object
      required: [title, startsAt, endsAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 2000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Must be later than `startsAt`. }
    CalendarEvent:
      type: object
      required: [id, projectId, title, startsAt, endsAt, createdByUserId, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    CreateAvailabilityPollRequest:
      type: object
      required: [title, options]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        options: { type: array, minItems: 2, maxItems: 8, items: { $ref: '#/components/schemas/AvailabilityPollOptionInput' } }
